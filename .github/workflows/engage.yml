name: Instagram Engage

# Replies to comments on our recent posts a few times a day. Fast replies boost
# the engagement signal and expand reach. Official API only — never touches
# other accounts (Instagram has no API to follow/like/comment on others).
on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: instagram-engage
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    # 25m leaves room for: runner queue + 0–8m jitter + npm ci + replies.
    # (A prior 15m timeout could expire while waiting for a hosted runner or
    # during a long jitter sleep — GitHub then reports the job as failed.)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Small random delay so replies don't land at the same clock minute daily.
      # Cap at 8m so we still have plenty of job time after the sleep.
      # (The script itself also staggers individual replies by a few seconds.)
      - name: Human-like start jitter
        if: github.event_name == 'schedule'
        run: |
          secs=$(( RANDOM % 480 ))
          echo "Sleeping ${secs}s before engaging…"
          sleep "$secs"
      - name: Reply to recent comments
        run: npx tsx scripts/social-engage.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          IG_BRAND_HANDLE: ${{ secrets.IG_BRAND_HANDLE }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_BASE: ${{ secrets.IG_GRAPH_BASE }}
