name: Instagram Posts

# Quality-over-quantity cadence: 3 posts/day across Indian peak hours
# (IST = UTC+5:30). Fewer, stronger posts concentrate reach on a small account
# and look far less automated/spammy than a 5x/day machine cadence. Each run
# posts ONE item; the type is chosen from the cron expression below:
#   02:30 UTC (~08:00 IST)  -> themed feed post
#   08:30 UTC (~14:00 IST)  -> history "From the Archives" Reel
#   13:00 UTC (~18:30 IST)  -> Indian-politics Reel
# NOTE: exact minutes below are just the EARLIEST trigger — the job then sleeps
# a random 0–30 min (see "Human-like start jitter") so we never post at the same
# clock minute every day, which is an obvious automation fingerprint.
on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 8 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Force a post type (theme|reel|reelpolitics|reelnews|article|story|reels3). Leave blank to auto-pick by time."
        required: false
        default: ""

concurrency:
  group: instagram-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      # Reels are assembled with ffmpeg (multi-image + voiceover). Ensure it's present.
      - name: Ensure ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # Pick the post type from the *cron expression that triggered this run*,
      # not the actual clock time — GitHub schedules routinely run 30–90 min
      # late, which used to make the delayed 06:00 "reel" slot post an article.
      - name: Pick post type
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "30 2 * * *")  action=theme ;;
            "30 8 * * *")  action=reel ;;
            "0 13 * * *")  action=reelpolitics ;;
            *)             action=article ;;
          esac
          if [ -n "${{ github.event.inputs.action }}" ]; then action="${{ github.event.inputs.action }}"; fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "Selected SOCIAL_ACTION=$action (schedule='${{ github.event.schedule }}')"
      # Sleep a random 0–30 min so we don't post at the exact same clock minute
      # every day. Skipped for manual (workflow_dispatch) runs so testing is instant.
      - name: Human-like start jitter
        if: github.event_name == 'schedule'
        run: |
          secs=$(( RANDOM % 1800 ))
          echo "Sleeping ${secs}s before posting to vary the daily timing…"
          sleep "$secs"
      - name: Post one Instagram item
        run: npx tsx scripts/social-slot.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ secrets.GEMINI_IMAGE_MODEL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          IG_BRAND_HANDLE: ${{ secrets.IG_BRAND_HANDLE }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_BASE: ${{ secrets.IG_GRAPH_BASE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SOCIAL_ACTION: ${{ steps.pick.outputs.action }}
